<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bezpieczny Profil - Aplikacja Bezpieczeństwa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ukrywanie paska przewijania dla czystszego wyglądu */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Animacja pulsująca dla przycisku SOS */
        @keyframes customPulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .btn-sos {
            animation: customPulse 2s infinite;
        }

        /* Animacje dla modali i toastów */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .fade-out { animation: fadeOut 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
    
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">
    
   

        <div id="main-screen" class="flex-1 flex flex-col bg-gray-50 overflow-y-auto hide-scrollbar z-10">
           <header class="bg-navy-900 text-white p-4 shadow-md shrink-0 flex justify-between items-center">
        <button onclick="showToast('Ustawienia aplikacji')" class="p-2 hover:bg-slate-800 rounded-full transition active:scale-95 flex items-center justify-center">
            <i class="fa-solid fa-gear text-xl"></i>
        </button>
        
        <h1 class="font-bold text-lg tracking-wide">Centrum Bezpieczeństwa</h1>
        
        <button onclick="showToast('Twój profil')" class="p-2 hover:bg-slate-800 rounded-full transition active:scale-95 flex items-center justify-center">
            <i class="fa-solid fa-user text-xl"></i>
        </button>
    </header> 

            <div class="flex flex-col items-center justify-center py-10 px-4 shrink-0">
                <button onclick="startHelpProcess()" class="btn-sos bg-red-600 hover:bg-red-700 text-white w-56 h-56 rounded-full flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-red-200 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-red-500 opacity-0 group-hover:opacity-20 transition"></div>
                    <i class="fa-solid fa-hand-holding-medical text-6xl mb-3"></i>
                    <span class="font-bold text-2xl uppercase tracking-wider text-center leading-tight">Potrzebuję<br>pomocy</span>
                </button>
                <p class="text-xs text-gray-500 mt-6 text-center font-medium">Naciśnij w nagłej sytuacji</p>
            </div>

            <!-- Siatka funkcji -->
<div class="grid grid-cols-3 gap-4 p-4">
    <!-- Przycisk 1: Alerty -->
    <button class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 transition active:scale-95 relative" onclick="showToast('Brak nowych zagrożeń')">
        <div class="w-10 h-10 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-bell"></i></div>
        <span class="font-semibold text-sm">Alerty</span>
    </button>
    
    <!-- Przycisk 2: Moje grupy -->
    <button class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 transition active:scale-95" onclick="showToast('Zarządzanie bliskimi')">
        <div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-users"></i></div>
        <span class="font-semibold text-sm">Moje grupy</span>
    </button>
    
    <!-- Przycisk 3: Mapa -->
    <button class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 transition active:scale-95" onclick="showToast('Otwieram mapę')">
        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-map-location-dot"></i></div>
        <span class="font-semibold text-sm">Mapa</span>
    </button>
    
    <!-- Przycisk 4: Kontakt -->
    <button class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 transition active:scale-95" onclick="showToast('Lista kontaktów')">
        <div class="w-10 h-10 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-address-book"></i></div>
        <span class="font-semibold text-sm">Kontakt</span>
    </button>
    
    <!-- Przycisk 5: Chatbot -->
    <button class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 transition active:scale-95" onclick="showToast('Uruchamiam asystenta AI')">
        <div class="w-10 h-10 bg-purple-50 text-purple-500 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-robot"></i></div>
        <span class="font-semibold text-sm">Chatbot</span>
    </button>
    
    <!-- Przycisk 6: Check in -->
    <button class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center gap-2 transition active:scale-95" onclick="showToast('Zameldowano pomyślnie!', 'success')">
        <div class="w-10 h-10 bg-green-50 text-green-500 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-location-dot"></i></div>
        <span class="font-semibold text-sm">Check in</span>
    </button>
</div>

        <div id="loading-screen" class="hidden flex-1 flex-col items-center justify-center bg-gray-50 z-20 px-6 absolute inset-0 top-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-10">Wysyłanie zgłoszenia...</h2>
            
            <div class="relative w-36 h-36 mb-10 flex items-center justify-center">
                <svg class="animate-spin absolute inset-0 w-full h-full text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                    <path class="opacity-80" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="countdown-timer" class="text-5xl font-black text-slate-800 z-10">5</span>
            </div>
            
            <p class="text-gray-500 mb-12 text-center text-sm px-4">Masz kilka sekund na anulowanie zgłoszenia, jeśli zostało wciśnięte przypadkowo.</p>
            
            <button onclick="cancelHelpProcess()" class="w-full max-w-[280px] bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-4 rounded-2xl transition shadow-sm text-lg uppercase tracking-wide">
                Anuluj
            </button>
        </div>

        <div id="status-screen" class="hidden flex-1 flex-col items-center justify-between bg-red-50 z-30 p-6 absolute inset-0 top-8">
            <div class="w-full flex flex-col items-center mt-12">
                <div class="w-28 h-28 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-5xl mb-6 shadow-inner btn-sos border-4 border-red-200">
                    <i class="fa-solid fa-tower-broadcast"></i>
                </div>
                <h2 class="text-3xl font-black text-red-700 mb-3 tracking-tight">Aktywny alarm</h2>
                
                <p class="text-sm font-semibold text-red-900/60 uppercase tracking-wider mb-2">Stan zgłoszenia</p>
                <div class="bg-white px-5 py-4 rounded-2xl border-2 border-red-100 shadow-md flex items-center gap-3">
                    <i class="fa-solid fa-spinner animate-spin text-red-500 text-xl"></i>
                    <span class="text-red-700 font-bold text-lg">Oczekujące na służby</span>
                </div>
            </div>
            
            <div class="w-full mb-8">
                <div class="bg-white/60 p-4 rounded-2xl mb-6 text-center text-sm text-slate-700 border border-red-100">
                    Służby zostały powiadomione. Twoja lokalizacja jest udostępniana na żywo.
                </div>
                <button onclick="revokeAlarm()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-2xl transition shadow-lg text-lg flex items-center justify-center gap-3 uppercase tracking-wide active:scale-95">
                    <i class="fa-solid fa-shield-xmark text-2xl"></i> Odwołaj alarm
                </button>
            </div>
        </div>

        <!-- Toast Notification (wspólny) -->
        <div id="toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full text-sm font-medium shadow-2xl z-[100] opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-3 whitespace-nowrap">
            <i id="toastIcon" class="fa-solid fa-circle-info text-lg"></i>
            <span id="toastMessage">Komunikat</span>
        </div>

    </div>

    <script>
        // System powiadomień
        let toastTimeout;
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            
            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-green-400 text-lg';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-red-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400 text-lg';
            }

            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        }

        // Mechanizm odliczania
        let helpTimeout;
        let countdownInterval;
        let timeLeft = 5;

        function startHelpProcess() {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('flex');
            
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.remove('hidden');
            loadingScreen.classList.add('flex', 'fade-in');
            
            timeLeft = 5;
            document.getElementById('countdown-timer').textContent = timeLeft;
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown-timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            helpTimeout = setTimeout(() => {
                showStatusScreen();
            }, 5000);
        }

        function cancelHelpProcess() {
            clearTimeout(helpTimeout);
            clearInterval(countdownInterval);
            
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.add('hidden');
            loadingScreen.classList.remove('flex', 'fade-in');
            
            const mainScreen = document.getElementById('main-screen');
            mainScreen.classList.remove('hidden');
            mainScreen.classList.add('flex', 'fade-in');
            
            showToast('Zgłoszenie zostało anulowane', 'info');
        }

        function showStatusScreen() {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.add('hidden');
            loadingScreen.classList.remove('flex');
            
            const statusScreen = document.getElementById('status-screen');
            statusScreen.classList.remove('hidden');
            statusScreen.classList.add('flex', 'fade-in');
            
            showToast('Zgłoszenie wysłane do służb!', 'error');
        }

        function revokeAlarm() {
            const statusScreen = document.getElementById('status-screen');
            statusScreen.classList.add('hidden');
            statusScreen.classList.remove('flex', 'fade-in');
            
            const mainScreen = document.getElementById('main-screen');
            mainScreen.classList.remove('hidden');
            mainScreen.classList.add('flex', 'fade-in');
            
            showToast('Alarm został pomyślnie odwołany', 'success');
        }
    </script>
</body>
</html>
